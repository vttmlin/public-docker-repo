name: Sync Docker Images to Aliyun ACR

on:
  push:
    branches: [master]
    paths:
      - "images.yaml"
      - ".github/workflows/sync-images.yaml"
  workflow_dispatch:

env:
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: tmdaq

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse images.yaml
        id: set-matrix
        run: |
          MATRIX=$(python3 -c "
          import yaml, json
          with open('images.yaml') as f:
              data = yaml.safe_load(f)
          images = [{'source': img} for img in data['images']]
          print(json.dumps({'include': images}))
          ")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  sync:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Pull and push image
        id: sync
        run: |
          SOURCE="${{ matrix.source }}"

          echo "==> Pulling: $SOURCE"
          docker pull "$SOURCE"

          # Parse image name and tag
          if [[ "$SOURCE" == *":"* ]]; then
            IMAGE_NAME="${SOURCE%:*}"
            TAG="${SOURCE##*:}"
          else
            IMAGE_NAME="$SOURCE"
            TAG="latest"
          fi

          # Replace dots and slashes with underscores for ACR single-level repo name
          # ghcr.io/astral-sh/uv → ghcr_io_astral-sh_uv
          # python → python
          IMAGE_NAME="${IMAGE_NAME//./_}"
          IMAGE_NAME="${IMAGE_NAME//\//_}"

          TARGET="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}:${TAG}"

          echo "==> Tagging: $TARGET"
          docker tag "$SOURCE" "$TARGET"

          echo "==> Pushing: $TARGET"
          docker push "$TARGET"

          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "==> Done: $TARGET"

          # Build a per-job history entry file (uploaded as an artifact for commit-history to aggregate).
          # Use Beijing time (UTC+8) so timestamps line up with the existing history.jsonl.
          PULL_TIME=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          SAFE_NAME=$(echo "$SOURCE" | tr '/:.' '_')
          ARTIFACT_NAME="history-${SAFE_NAME}"

          mkdir -p history-entries
          printf '{"time":"%s","name":"%s","proxy_name":"%s"}\n' \
            "$PULL_TIME" "$SOURCE" "$TARGET" \
            > "history-entries/${SAFE_NAME}.json"

          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload history entry
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sync.outputs.artifact_name }}
          path: history-entries/*.json

      - name: Notify
        if: success()
        run: |
          curl -s -X POST "https://api.day.app/push" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "title": "【public-docker-repo：镜像同步完成】",
              "body": "源: ${{ matrix.source }}\n目标: ${{ steps.sync.outputs.target }}",
              "group": "docker-sync",
              "device_key": "${{ secrets.BARK_DEVICE_KEY }}"
            }'

  commit-history:
    needs: sync
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download per-job history entries
        uses: actions/download-artifact@v4
        with:
          path: history-entries
          pattern: history-*
          merge-multiple: true

      - name: Append new entries to history.jsonl
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import glob

          history_file = 'history.jsonl'
          existing_proxies = set()

          if os.path.exists(history_file):
              with open(history_file, 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          existing_proxies.add(json.loads(line)['proxy_name'])
                      except Exception:
                          pass

          new_lines = []
          for entry_file in sorted(glob.glob('history-entries/*.json')):
              with open(entry_file, 'r', encoding='utf-8') as f:
                  content = f.read().strip()
              if not content:
                  continue
              try:
                  entry = json.loads(content)
              except Exception as e:
                  print(f"Skipping {entry_file}: {e}")
                  continue
              if entry['proxy_name'] in existing_proxies:
                  print(f"Already recorded: {entry['proxy_name']}")
                  continue
              new_lines.append(json.dumps(entry, ensure_ascii=False))
              existing_proxies.add(entry['proxy_name'])

          if new_lines:
              with open(history_file, 'a', encoding='utf-8') as f:
                  for line in new_lines:
                      f.write(line + '\n')
              print(f"Appended {len(new_lines)} new entries")
          else:
              print("No new entries to append")
          PYEOF

      - name: Commit and push history.jsonl
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pick up any concurrent commits that landed on the branch while this
          # job was running (rare for this repo, but cheap insurance).
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true

          git add history.jsonl
          if git diff --staged --quiet; then
            echo "No changes to history.jsonl"
          else
            git commit -m "chore: record synced images in history.jsonl"
            git push
          fi